/* ---- Custom picker (substitui <select> nativo) ---- */
.pk-tr{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 9px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;cursor:pointer;transition:all var(--tr);min-height:30px;max-width:100%}
.pk-tr:hover{border-color:var(--bd2);background:var(--bg4)}
.pk-tr .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.pk-tr .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pk-tr .placeholder{color:var(--tx3);font-weight:400;font-style:italic}
.pk-tr .car{color:var(--tx3);font-size:11px;margin-left:auto}

.pk-tr .x:hover{background:var(--bg);color:var(--rd)}
.pk-pop{position:fixed;min-width:280px;max-width:380px;background:var(--bg2);border:1px solid var(--bd2);border-radius:11px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:250;display:flex;flex-direction:column;max-height:360px;overflow:hidden;animation:pk-in .14s ease}
@keyframes pk-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.pk-srch{padding:9px 10px;border-bottom:1px solid var(--bd)}
.pk-srch input{width:100%;background:var(--bg3);border:1px solid transparent;border-radius:7px;padding:7px 11px;color:var(--tx);font-size:12.5px;outline:0;transition:all var(--tr)}

.pk-list{flex:1;overflow-y:auto;padding:5px}
.pk-i{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;cursor:pointer;font-size:13px;transition:background var(--tr);position:relative}
.pk-i:hover,.pk-i.kbd{background:var(--bg3)}
.pk-i.cur{background:#7c6ff715}

.pk-i .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}

.pk-i.null-opt .lbl{color:var(--tx3)}
.pk-divider{height:1px;background:var(--bd);margin:4px 8px}
.pk-empty{padding:18px;text-align:center;color:var(--tx3);font-size:12px;font-style:italic}
/* ---- Date picker (mesmo padrão visual do picker) ---- */
.dp{padding:10px;width:280px}

.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}

.dp-d.dim{color:var(--tx3);opacity:.4}

.dp-foot{display:flex;justify-content:space-between;padding:9px 4px 2px;border-top:1px solid var(--bd);margin-top:9px}
.dp-foot a{font-size:12px;color:var(--tx3);cursor:pointer;padding:4px 9px;border-radius:6px;transition:all var(--tr);text-decoration:none;font-weight:600}

// BACKUP AUTOMÁTICO PRO GOOGLE DRIVE
// ============================================================
const DRIVE_SEARCH_TOOL='mcp__bb02d8c6-c7fa-4c25-a02c-e646a497b054__search_files';
const DRIVE_CREATE_TOOL='mcp__bb02d8c6-c7fa-4c25-a02c-e646a497b054__create_file';
const BACKUP_FOLDER_NAME='Oraculo Backup';
const BACKUP_INTERVAL_MS=4*60*60*1000; // 4h

function fmtAgo(ms){
  if(ms<60000)return 'agora';
  if(ms<3600000)return Math.floor(ms/60000)+'m';
  if(ms<86400000)return Math.floor(ms/3600000)+'h';
  return Math.floor(ms/86400000)+'d'
}

// Procura ou cria a pasta "Oraculo Backup" no Drive (ID cacheado no localStorage)
async function ensureBackupFolder(){
  const cached=localStorage.getItem('oraculo-backup-folder-id');
  if(cached)return cached;
  // Search
  const sr=um(await window.cowork.callMcpTool(DRIVE_SEARCH_TOOL,{
    query:`title = '${BACKUP_FOLDER_NAME}' and mimeType = 'application/vnd.google-apps.folder' and 'me' in owners`,
    pageSize:3
  }));
  const found=(sr?.files||sr?.items||[])[0];
  if(found?.id){localStorage.setItem('oraculo-backup-folder-id',found.id);return found.id}
  // Create
  const cr=um(await window.cowork.callMcpTool(DRIVE_CREATE_TOOL,{
    title:BACKUP_FOLDER_NAME,
    mimeType:'application/vnd.google-apps.folder'
  }));
  if(cr?.id){localStorage.setItem('oraculo-backup-folder-id',cr.id);return cr.id}
  return null
}

async function backupToDrive(opts={}){
  const silent=opts.silent===true,manual=opts.manual===true;
  if(!window.cowork?.callMcpTool){if(!silent)alert('Backup indisponível: precisa do Cowork');return}
  setBackupStatus('uploading');
  try{
    const folderId=await ensureBackupFolder();
    if(!folderId)throw new Error('Pasta Oraculo Backup não pôde ser criada');
    const today=id(new Date());
    const fileName=manual
      ? `oraculo-backup-${new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}.json`
      : `oraculo-backup-${today}.json`;
    // Auto-backup: skip se já existe arquivo de hoje
    if(!manual){
      const sr=um(await window.cowork.callMcpTool(DRIVE_SEARCH_TOOL,{
        query:`title = '${fileName}' and parentId = '${folderId}' and 'me' in owners`,
        pageSize:1
      }));
      if((sr?.files||sr?.items||[])[0]){
        localStorage.setItem('oraculo-last-backup',Date.now().toString());
        setBackupStatus('ok');
        return
      }
    }
    const payload={version:1,backedUpAt:new Date().toISOString(),device:(navigator.userAgent||'').slice(0,100),data:D};
    const cr=um(await window.cowork.callMcpTool(DRIVE_CREATE_TOOL,{
      title:fileName,
      textContent:JSON.stringify(payload),
      contentMimeType:'application/json',
      parentId:folderId,
      disableConversionToGoogleType:true
    }));
    if(!cr?.id)throw new Error('Drive não retornou file id');
    localStorage.setItem('oraculo-last-backup',Date.now().toString());
    localStorage.setItem('oraculo-last-backup-file',cr.id);
    setBackupStatus('ok');
    if(!silent)alert(`✓ Backup salvo no Drive: ${fileName}`);
  }catch(e){console.error('Backup falhou',e);setBackupStatus('error');if(!silent)alert('Erro no backup: '+(e?.message||e))}
}

function setBackupStatus(state){
  const el=document.getElementById('bk-status');if(!el)return;
  const last=parseInt(localStorage.getItem('oraculo-last-backup')||'0',10);
  const ago=last?fmtAgo(Date.now()-last):'nunca';
  const ic={uploading:'⟳',ok:'☁✓',error:'☁⚠',idle:'☁'};
  const co={uploading:'var(--ac)',ok:'var(--gr)',error:'var(--rd)',idle:'var(--tx3)'};
  el.style.color=co[state]||co.idle;
  el.textContent=`${ic[state]||ic.idle} ${ago}`;
  el.title=last?`Último backup: ${new Date(last).toLocaleString('pt-BR')}`:'Nenhum backup ainda · clique pra fazer agora';
}

function maybeAutoBackup(){
  const last=parseInt(localStorage.getItem('oraculo-last-backup')||'0',10);
  if(Date.now()-last>BACKUP_INTERVAL_MS){setTimeout(()=>backupToDrive({silent:true}),3000)}
}

let _pkEl=null,_pkKbd=0,_pkItems=[];

function _pkKey(ev){

  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){

function openPicker(triggerEl,options,currentId,onChange,opts={}){
  pkClose();
  const nullable=opts.nullable===true;
  const nullLabel=opts.nullLabel||'Nenhum';
  const placeholder=opts.placeholder||'Buscar…';
  const rect=triggerEl.getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='pk-pop';
  pop.style.left=rect.left+'px';
  pop.style.top=(rect.bottom+6)+'px';
  pop.style.width=Math.max(rect.width,280)+'px';
  document.body.appendChild(pop);
  _pkEl=pop;
  // Reposiciona se cai fora da tela
  setTimeout(()=>{
    const pr=pop.getBoundingClientRect();
    if(pr.bottom>window.innerHeight-10)pop.style.top=(rect.top-pr.height-6)+'px';
    if(pr.right>window.innerWidth-10)pop.style.left=(window.innerWidth-pr.width-10)+'px'
  },10);
  const render=(filter='')=>{
    const f=filter.toLowerCase().trim();
    const matches=options.filter(o=>!f||(o.label||'').toLowerCase().includes(f)||(o.sub||'').toLowerCase().includes(f));
    const showNull=nullable&&(!f||nullLabel.toLowerCase().includes(f));
    const items=[];
    if(showNull){
      items.push(`<div class="pk-i null-opt ${currentId==null?'cur':''}" data-val=""><span class="dot" style="background:var(--bd2)"></span><span class="lbl">∅ ${e(nullLabel)}</span>${currentId==null?'<span class="chk">✓</span>':''}</div>`);
      if(matches.length>0)items.push(`<div class="pk-divider"></div>`)
    }
    if(matches.length===0&&!showNull){items.push(`<div class="pk-empty">Nenhum resultado</div>`)}
    else matches.forEach(o=>{
      items.push(`<div class="pk-i ${o.id===currentId?'cur':''}" data-val="${e(o.id)}"><span class="dot" style="background:${o.color||'var(--tx3)'}"></span><span class="lbl">${e(o.label)}</span>${o.sub?`<span class="sub">${e(o.sub)}</span>`:''}${o.id===currentId?'<span class="chk">✓</span>':''}</div>`)
    });
    pop.innerHTML=`<div class="pk-srch"><input type="text" placeholder="${e(placeholder)}" value="${e(filter)}"></div><div class="pk-list">${items.join('')}</div>`;
    const inp=pop.querySelector('input');
    inp.addEventListener('input',()=>render(inp.value));
    _pkItems=Array.from(pop.querySelectorAll('.pk-i'));
    _pkKbd=Math.max(0,_pkItems.findIndex(el=>el.classList.contains('cur')));
    _pkItems.forEach((el,i)=>{
      if(i===_pkKbd)el.classList.add('kbd');
      el.addEventListener('click',()=>{
        const v=el.dataset.val||null;
        pkClose();
        onChange(v)

    });

  };

}

// Migração one-shot: limpa campos legados de sync (idempotente)
function migrateLegacy(){
  // Sempre roda rename do bucket órfão (idempotente)
  const orphanFix=D.projects.find(p=>p.id==='_jira_orphan');
  if(orphanFix){orphanFix.title='Sem épico';delete orphanFix.system;delete orphanFix.jiraEpicKey;sv()}
  if(localStorage.getItem('oraculo-legacy-cleaned')==='1')return;
  D.projects.forEach(p=>{
    delete p.jiraEpicKey;delete p.jiraEpicId;delete p.jiraEpicUrl;delete p.jiraProjectName;delete p.lastSyncedAt;
    (p.tasks||[]).forEach(t=>{
      delete t.jiraKey;delete t.jiraId;delete t.jiraUrl;delete t.source;
      delete t.syncError;delete t.lastPushedAt;delete t.lastSyncedAt;delete t.syncedAt
    })
  });
  // Bucket órfão fica como projeto normal — só tira system/id especiais
  const orphan=D.projects.find(p=>p.id==='_jira_orphan');
  if(orphan){orphan.title='Sem épico';delete orphan.system}
  // Bucket "_unassigned" continua sistema, sem mudar
  // Limpa data de sync antigos + queue
  delete D.jiraIssues;delete D.jiraLastFetch;
  localStorage.removeItem('oraculo-sync-queue');
  localStorage.removeItem('oraculo-last-jira-sync');
  // Limpa cache de transitions legadas
  Object.keys(localStorage).filter(k=>k.startsWith('oraculo-tr-')).forEach(k=>localStorage.removeItem(k));
  sv();
  localStorage.setItem('oraculo-legacy-cleaned','1');
  console.log('✓ Migração de dados legados concluída')
}

  setInterval(()=>setBackupStatus('idle'),60_000);
})();
</script>
